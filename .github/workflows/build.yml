name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 还原签名密钥：仅当配置了 SIGNING_KEY secret 时执行（base64 解码为 jks 文件）。
      # 密钥库密码 / 别名密码 / 别名分别由 SIGNING_KEY_PASSWORD / SIGNING_PASSWORD /
      # SIGNING_KEY_ALIAS 环境变量传入，Gradle 在 build.gradle.kts 中读取。
      - name: Restore signing key
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/mimarket.jks"
          echo "签名密钥已还原 -> $RUNNER_TEMP/mimarket.jks"

      # NOTE: `set -o pipefail` is mandatory here. Without it the exit status of
      # `gradlew | tee` is tee's (always 0), which silently turns every build
      # failure into a green outcome.
      # 打 release 包：isMinifyEnabled + isShrinkResources + R8 full mode 已将体积
      # 从 debug 的约 33M 压到几 MB（33M 的根因是此前一直打未混淆的 debug 包）。
      # 配置签名密钥时产出「已签名、可安装」的 release APK；未配置则仍打已裁剪的未签名包。
      - name: Build Release APK
        id: build
        continue-on-error: true
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            ./gradlew assembleRelease --stacktrace \
              -PmimarketSigningStoreFile="$RUNNER_TEMP/mimarket.jks" 2>&1 | tee gradle-build.log
          else
            ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle-build.log
          fi
          echo "gradlew_exit_code=${PIPESTATUS[0]}"

      # Always produce a diagnostics bundle: useful for debugging even when the
      # build reports success (e.g. "green but no APK produced").
      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "=== CI diagnostics ==="
            echo "generated at : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "workflow run : ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "head sha     : ${{ github.sha }}"
            echo "build outcome: ${{ steps.build.outcome }}"
            echo

            echo "=== toolchain versions ==="
            java -version 2>&1 | head -3 || true
            echo "-- gradlew --version --"
            timeout 120 ./gradlew --version 2>&1 | head -25 || echo "(gradlew --version failed or timed out)"
            echo

            echo "=== produced apk / aab ==="
            if [ -d app/build/outputs ]; then
              find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) 2>/dev/null | sort || true
            else
              echo "(app/build/outputs does not exist)"
            fi
            echo

            echo "=== app/build/outputs tree ==="
            if [ -d app/build/outputs ]; then
              find app/build/outputs -maxdepth 4 2>/dev/null | head -120 || true
            else
              echo "(app/build/outputs does not exist)"
            fi
            echo

            if [ -f gradle-build.log ]; then
              echo "=== kotlin compile error lines (e:) ==="
              grep -nE '^e: ' gradle-build.log | head -120 || echo "(no kotlin error lines)"
              echo
              echo "=== gradle 'What went wrong' block ==="
              awk '/^What went wrong:/{f=1} f{print} /^\* Try:/{exit}' gradle-build.log | head -80 || echo "(not found)"
              echo
              echo "=== gradle '* Exception is:' block ==="
              awk '/^\* Exception is:/{f=1} f{print}' gradle-build.log | head -60 || echo "(not found)"
              echo
              echo "=== gradle 'Build failed' / 'FAILURE' block ==="
              awk '/^(FAILURE:|BUILD FAILED)/{f=1} f{print}' gradle-build.log | head -60 || echo "(not found)"
              echo
              echo "=== gradle-build.log tail (1000) ==="
              tail -n 1000 gradle-build.log
            else
              echo "(gradle-build.log was never created -> gradlew likely did not run)"
            fi
          } > ci-report.log 2>&1

      - name: Upload diagnostics log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-report
          path: ci-report.log
          retention-days: 30

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: MiMarketPurify-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Fail job when build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      # Only on failure: commit ci-report.log so it can be read without Actions-Log
      # API access. The message carries [skip ci] to avoid re-triggering itself.
      #
      # Tip: if you ever need to verify a SUCCESSFUL build from outside Actions,
      # temporarily add a step that also writes `ci-status/latest.txt` with the
      # outcome + `find app/build/outputs/apk -type f -name '*.apk' -printf '%s\n'`
      # and pushes it with [skip ci]. Green means nothing without the APK bytes.
      # NOTE: `git commit` exits 1 when nothing is staged. ci-status/latest.txt is
      # byte-identical whenever the outcome + APK size did not change, and the
      # runner also marks `gradlew` as modified (chmod +x) without staging it.
      # Both used to surface as a red "build error" even though the APK was fine.
      # Guards: ignore file mode, and only commit/push when there is a real diff.
      - name: Publish build summary (always)
        if: always()
        run: |
          git config core.fileMode false
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          {
            echo "run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "sha: ${{ github.sha }}"
            echo "outcome: ${{ steps.build.outcome }}"
            echo "apk:"
            find app/build/outputs/apk -type f -name '*.apk' -printf '  %p %s bytes\n' 2>/dev/null || true
          } > ci-status/latest.txt
          git add -f ci-status
          if git diff --cached --quiet; then
            echo "ci-status 无变化，跳过提交"
            exit 0
          fi
          git commit -m "ci: status run ${{ github.run_id }} [skip ci]"
          git push origin HEAD:master || echo "推送失败（并发/无权限），忽略"

      - name: Publish diagnostics (failure only)
        if: always() && steps.build.outcome == 'failure'
        run: |
          git config core.fileMode false
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p diag
          cp ci-report.log "diag/run-${{ github.run_id }}.txt"
          git add -f diag
          if git diff --cached --quiet; then
            echo "diag 无变化，跳过提交"
            exit 0
          fi
          git commit -m "diag: run ${{ github.run_id }} [skip ci]"
          git push origin HEAD:master || echo "推送失败（并发/无权限），忽略"

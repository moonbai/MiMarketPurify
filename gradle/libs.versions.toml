[versions]
agp = "9.1.0"
coreKtx = "1.18.0"
ezxhelper = "3.1.1-rc1"
newxposed = "101.0.0"
libxposedService = "101.0.0"
# ── 新增：Compose + Miuix KMP（参考 HyperModifier 悬浮底栏重写）──
composeBom     = "2025.01.00"
material3      = "1.5.0-alpha22"
activityCompose = "1.10.1"
miuixKmp       = "0.9.4-rc01"

[libraries]
androidx-core-ktx        = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
ezxhelper-core           = { group = "io.github.kyuubiran.ezxhelper", name = "core", version.ref = "ezxhelper" }
libxposed-api            = { group = "io.github.libxposed", name = "api", version.ref = "newxposed" }
libxposed-service        = { group = "io.github.libxposed", name = "service", version.ref = "libxposedService" }

# ── 新增：Compose（BOM 统一版本）──
androidx-compose-bom            = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui             = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics    = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3      = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-activity-compose       = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# ── 新增：Miuix KMP（公开依赖，非 HyperModifier 私有死liner 包）──
# miuix-ui-android 提供 MiuixTheme / Colors / lightColorScheme / darkColorScheme
# miuix-blur-android 提供 rememberLayerBackdrop / layerBackdrop（毛玻璃）
miuix-ui-android               = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuixKmp" }
miuix-blur-android             = { group = "top.yukonga.miuix.kmp", name = "miuix-blur-android", version.ref = "miuixKmp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

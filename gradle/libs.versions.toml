[versions]
agp = "9.1.0"
# Kotlin 版本：AGP 9 内置 Kotlin 编译，但 Compose 编译器插件（org.jetbrains.kotlin.plugin.compose）
# 必须与 Kotlin 同号。此处对齐已验证可构建 MiuiX 的 miuix 分支（2.4.20）。
# 参见官方指南：https://kotlinlang.org/docs/compose-compiler-migration-guide.html
kotlin = "2.4.20"
coreKtx = "1.18.0"
ezxhelper = "3.1.1-rc1"
newxposed = "101.0.0"
libxposedService = "101.0.0"
# ── 新增：Compose + Miuix KMP（参考 HyperModifier 悬浮底栏重写）──
composeBom     = "2025.01.00"
activityCompose = "1.10.1"
miuixKmp       = "0.9.4"
# lifecycle-runtime-ktx：提供 find/setViewTreeLifecycleOwner、find/setViewTreeSavedStateRegistryOwner 等
# ViewTree owner 扩展（ComposeFloatingBarHost / InjectedViewTreeOwner 依赖）。
lifecycleRuntimeKtx = "2.8.7"
# ── 新增：HyperModifier 悬浮底栏实际依赖 io.github.kyant0:shapes（提供 Capsule 胶囊形状）──
kyantShapes    = "1.2.0"
# ── 新增：AndroidX NavigationEvent（MiuiX Window* 组件的返回手势依赖）──
# MiuiX（miuix-ui / miuix-preference 0.9.4）已传递依赖 navigationevent-compose 1.1.2；
# 此处显式锁定同版本，供本模块直接提供 LocalNavigationEventDispatcherOwner（见 ModuleTheme）。
androidxNavigationEvent = "1.1.2"

[libraries]
androidx-core-ktx        = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
ezxhelper-core           = { group = "io.github.kyuubiran.ezxhelper", name = "core", version.ref = "ezxhelper" }
libxposed-api            = { group = "io.github.libxposed", name = "api", version.ref = "newxposed" }
libxposed-service        = { group = "io.github.libxposed", name = "service", version.ref = "libxposedService" }

# ── 新增：Compose（BOM 统一版本）──
androidx-compose-bom            = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui             = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics    = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# ── 新增：material3（悬浮底栏 MiuixFloatingTabBar 与主页 Compose 直接依赖 MaterialTheme/Icon/Text；
#    与 HyperModifier 的依赖方案一致；体积由 release 构建的 R8 + shrinkResources 兜底，非体积主因）──
androidx-compose-material3      = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-foundation     = { group = "androidx.compose.foundation", name = "foundation" }
androidx-activity-compose       = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx   = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# ── 新增：Miuix KMP（公开依赖，非 HyperModifier 私有死liner 包）──
# miuix-ui-android 提供 MiuixTheme / Colors / lightColorScheme / darkColorScheme
# miuix-blur-android 提供 rememberLayerBackdrop / layerBackdrop（毛玻璃）
miuix-ui-android               = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuixKmp" }
miuix-blur-android             = { group = "top.yukonga.miuix.kmp", name = "miuix-blur-android", version.ref = "miuixKmp" }
# ── 新增：MiuiX 偏好组件（SpinnerPreference / SliderPreference / RadioButtonPreference 等）──
# 与上方 miuix-ui-android 同源同版本（0.9.4），提供「下拉单选 / 多选 / Adjust Volume 滑杆」等原生 MiuiX 设置控件，
# 用于主题模式 Spinner、筛选底栏 Grouped Spinner、可编辑滑杆等需求；依赖 miuix-ui（已随 miuix-ui-android 引入）。
miuix-preference-android       = { group = "top.yukonga.miuix.kmp", name = "miuix-preference-android", version.ref = "miuixKmp" }
# ── 新增：HyperModifier 实际依赖 io.github.kyant0:shapes（提供 Capsule 胶囊形状，用于悬浮底栏容器与指示器）──
kyant-shapes                   = { group = "io.github.kyant0", name = "shapes", version.ref = "kyantShapes" }
# ── 新增：AndroidX NavigationEvent（MiuiX Window* 组件展开下拉窗时读取 LocalNavigationEventDispatcherOwner）──
androidx-navigationevent       = { group = "androidx.navigationevent", name = "navigationevent-compose", version.ref = "androidxNavigationEvent" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Compose 编译器插件：必须带版本，且与上面 kotlin 同号（Kotlin 2.0+ 已并入 Kotlin 仓库）。
# AGP 9 下用 alias + 根 build `apply false` 接线，无需 kotlin-android 插件。
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
